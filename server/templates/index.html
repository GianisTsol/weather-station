<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather Station</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --border:   #21262d;
      --accent:   #58a6ff;
      --accent2:  #3fb950;
      --warn:     #d29922;
      --text:     #e6edf3;
      --muted:    #8b949e;
      --font-mono: 'IBM Plex Mono', monospace;
      --font-sans: 'IBM Plex Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      padding: 2rem;
    }

    header {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    header h1 {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--accent);
    }

    #status {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--muted);
      margin-left: auto;
    }

    #status.ok::before  { content: "● "; color: var(--accent2); }
    #status.err::before { content: "● "; color: #f85149; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.25rem 1.5rem;
    }

    .card .label {
      font-size: 0.7rem;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .card .value {
      font-family: var(--font-mono);
      font-size: 2rem;
      font-weight: 600;
      line-height: 1;
    }

    .card .unit {
      font-size: 0.9rem;
      color: var(--muted);
      margin-left: 0.2rem;
    }

    .card .timestamp {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }

    .card.temp  .value { color: #ff7b72; }
    .card.hum   .value { color: var(--accent); }
    .card.press .value { color: var(--accent2); }
    .card.bat   .value { color: var(--warn); }

    .chart-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
    }

    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .chart-header h2 {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .range-btns {
      display: flex;
      gap: 0.25rem;
    }

    .range-btns button {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.65rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .range-btns button:hover  { border-color: var(--accent); color: var(--accent); }
    .range-btns button.active { border-color: var(--accent); color: var(--accent); background: var(--accent)18; }

    canvas { width: 100% !important; }

    #no-data {
      text-align: center;
      padding: 4rem;
      font-family: var(--font-mono);
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<header>
  <h1>// weather station</h1>
  <span id="status">connecting…</span>
</header>

<div class="grid">
  <div class="card temp">
    <div class="label">Temperature</div>
    <div class="value" id="val-temp">—<span class="unit">°C</span></div>
    <div class="timestamp" id="ts">—</div>
  </div>
  <div class="card hum">
    <div class="label">Humidity</div>
    <div class="value" id="val-hum">—<span class="unit">%</span></div>
  </div>
  <div class="card press">
    <div class="label">Pressure</div>
    <div class="value" id="val-press">—<span class="unit">kPa</span></div>
  </div>
  <div class="card bat">
    <div class="label">Battery</div>
    <div class="value" id="val-bat">—<span class="unit">V</span></div>
  </div>
</div>

<div class="chart-section">
  <div class="chart-header">
    <h2>Temperature</h2>
    <div class="range-btns" data-chart="temp"></div>
  </div>
  <canvas id="chart-temp" height="100"></canvas>
</div>

<div class="chart-section">
  <div class="chart-header">
    <h2>Humidity</h2>
    <div class="range-btns" data-chart="hum"></div>
  </div>
  <canvas id="chart-hum" height="100"></canvas>
</div>

<div class="chart-section">
  <div class="chart-header">
    <h2>Battery Voltage</h2>
    <div class="range-btns" data-chart="bat"></div>
  </div>
  <canvas id="chart-bat" height="100"></canvas>
</div>

<div id="no-data" style="display:none">No data yet. Waiting for the first reading from the station.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
  const POLL_INTERVAL  = 30_000; // ms
  const DATA_INTERVAL  = 60;     // seconds between readings from the station
  const BASE           = "";

  // Range definitions: label → seconds of history
  const RANGES = [
    { label: "1H",  seconds: 3600 },
    { label: "6H",  seconds: 21600 },
    { label: "1D",  seconds: 86400 },
    { label: "1W",  seconds: 604800 },
    { label: "1M",  seconds: 2592000 },
  ];
  const DEFAULT_RANGE = "1H";

  const $ = id => document.getElementById(id);
  const status = $("status");

  // ── Timestamp ─────────────────────────────────────────────
  function parseTs(ts) {
    const n = Number(ts);
    if (!isNaN(n) && n > 1_000_000_000) return new Date(n * 1000);
    return new Date(String(ts).includes("Z") ? ts : ts + "Z");
  }

  function fmtLabel(ts, rangeSecs) {
    const d = parseTs(ts);
    if (isNaN(d)) return "—";
    // show date+time for ranges > 1 day, just time otherwise
    if (rangeSecs > 86400) {
      return d.toLocaleDateString([], { month: "short", day: "numeric" })
           + " " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function shortTime(ts) {
    const d = parseTs(ts);
    if (isNaN(d)) return "—";
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  // ── Charts ────────────────────────────────────────────────
  function makeChart(id, color) {
    return new Chart($(id), {
      type: "line",
      data: {
        labels: [],
        datasets: [{
          data: [],
          borderColor: color,
          borderWidth: 2,
          pointRadius: 2,
          pointBackgroundColor: color,
          fill: true,
          backgroundColor: color + "18",
          tension: 0.3
        }]
      },
      options: {
        animation: false,
        responsive: true,
        plugins: { legend: { display: false }, tooltip: { mode: "index" } },
        scales: {
          x: {
            ticks: { color: "#8b949e", font: { family: "IBM Plex Mono", size: 10 }, maxTicksLimit: 10 },
            grid: { color: "#21262d" }
          },
          y: {
            ticks: { color: "#8b949e", font: { family: "IBM Plex Mono", size: 10 } },
            grid: { color: "#21262d" },
            grace: "10%"
          }
        }
      }
    });
  }

  const charts = {
    temp: makeChart("chart-temp", "#ff7b72"),
    hum:  makeChart("chart-hum",  "#58a6ff"),
    bat:  makeChart("chart-bat",  "#d29922"),
  };

  const chartKeys = { temp: "temperature", hum: "humidity", bat: "bat_voltage" };

  // active range per chart
  const activeRange = { temp: DEFAULT_RANGE, hum: DEFAULT_RANGE, bat: DEFAULT_RANGE };

  // ── Range buttons ─────────────────────────────────────────
  document.querySelectorAll(".range-btns").forEach(container => {
    const chartId = container.dataset.chart;
    RANGES.forEach(r => {
      const btn = document.createElement("button");
      btn.textContent = r.label;
      if (r.label === DEFAULT_RANGE) btn.classList.add("active");
      btn.onclick = () => {
        activeRange[chartId] = r.label;
        container.querySelectorAll("button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        fetchHistory(chartId);
      };
      container.appendChild(btn);
    });
  });

  // ── Helpers ───────────────────────────────────────────────
  function fmt(val, digits = 1) {
    return val != null ? Number(val).toFixed(digits) : "—";
  }

  function updateChart(chartId, rows) {
    const rangeSecs = RANGES.find(r => r.label === activeRange[chartId]).seconds;
    // downsample if too many points (keep max ~300 points for performance)
    const step = Math.max(1, Math.floor(rows.length / 300));
    const pts  = [...rows].reverse().filter((_, i) => i % step === 0);
    const chart = charts[chartId];
    chart.data.labels = pts.map(r => fmtLabel(r.timestamp, rangeSecs));
    chart.data.datasets[0].data = pts.map(r => r[chartKeys[chartId]]);
    chart.update();
  }

  // ── Fetch ─────────────────────────────────────────────────
  function fetchLatest() {
    fetch(`${BASE}/api/latest`)
      .then(r => r.json())
      .then(d => {
        if (!d || !d.temperature) return;
        $("val-temp").innerHTML  = `${fmt(d.temperature)}<span class="unit">°C</span>`;
        $("val-hum").innerHTML   = `${fmt(d.humidity)}<span class="unit">%</span>`;
        $("val-press").innerHTML = d.pressure    != null ? `${fmt(d.pressure, 2)}<span class="unit">kPa</span>` : "—";
        $("val-bat").innerHTML   = d.bat_voltage != null ? `${fmt(d.bat_voltage, 2)}<span class="unit">V</span>` : "—";
        $("ts").textContent = "updated " + shortTime(d.timestamp);
        status.textContent = "live";
        status.className = "ok";
      })
      .catch(() => {
        status.textContent = "offline";
        status.className = "err";
      });
  }

  function fetchHistory(chartId = null) {
    const targets = chartId ? [chartId] : Object.keys(charts);
    targets.forEach(id => {
      const rangeSecs = RANGES.find(r => r.label === activeRange[id]).seconds;
      const since     = Math.floor(Date.now() / 1000) - rangeSecs;
      // limit as a safety cap: range / interval + 10% headroom
      const limit     = Math.ceil(rangeSecs / DATA_INTERVAL * 1.1);
      fetch(`${BASE}/api/history?since=${since}&limit=${limit}`)
        .then(r => r.json())
        .then(rows => {
          if (!rows.length) { $("no-data").style.display = "block"; return; }
          $("no-data").style.display = "none";
          updateChart(id, rows);
        });
    });
  }

  fetchLatest();
  fetchHistory();
  setInterval(fetchLatest,  POLL_INTERVAL);
  setInterval(fetchHistory, POLL_INTERVAL * 2);
</script>

</body>
</html>

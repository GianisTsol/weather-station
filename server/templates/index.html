<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather Station</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">
  <script>
  window.APP_CONFIG = {
      apiLatest: "{{ url_for('latest') }}",
      apiHistory: "{{ url_for('history') }}"
  };
  </script>

  <script src="{{ url_for('static', filename='main.js') }}"></script>
</head>
<body>

<header>
  <h1>// weather station</h1>
  <span id="status">connecting…</span>
</header>

<div class="grid">
  <div class="card temp">
    <div class="label">Temperature</div>
    <div class="value" id="val-temp">—<span class="unit">°C</span></div>
    <div class="timestamp" id="ts">—</div>
  </div>
  <div class="card hum">
    <div class="label">Humidity</div>
    <div class="value" id="val-hum">—<span class="unit">%</span></div>
  </div>
  <div class="card press">
    <div class="label">Pressure</div>
    <div class="value" id="val-press">—<span class="unit">kPa</span></div>
  </div>
  <div class="card bat">
    <div class="label">Battery</div>
    <div class="value" id="val-bat">—<span class="unit">V</span></div>
  </div>
</div>

<div class="chart-section">
  <div class="chart-header">
    <h2>Temperature</h2>
    <div class="range-btns" data-chart="temp"></div>
  </div>
  <canvas id="chart-temp" height="100"></canvas>
</div>

<div class="chart-section">
  <div class="chart-header">
    <h2>Humidity</h2>
    <div class="range-btns" data-chart="hum"></div>
  </div>
  <canvas id="chart-hum" height="100"></canvas>
</div>

<div class="chart-section">
  <div class="chart-header">
    <h2>Battery Voltage</h2>
    <div class="range-btns" data-chart="bat"></div>
  </div>
  <canvas id="chart-bat" height="100"></canvas>
</div>

<div id="no-data" style="display:none">No data yet. Waiting for the first reading from the station.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

</body>
</html>
